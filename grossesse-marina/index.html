<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grossesse Marina</title>
<meta name="description" content="Suivi de grossesse de Marina : semaines, rendez-vous, prénoms, alimentation, guides et assistant.">
<meta name="theme-color" content="#F5F2FC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13101D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Outfit:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="garden" aria-hidden="true"><i></i><i></i><i></i></div>
<canvas id="sparkles" aria-hidden="true"></canvas>

<div class="app">
  <header class="top" id="top">
    <div class="brand"><h1>Grossesse <span id="brandName">Marina</span></h1></div>
    <span class="sync" id="sync">Sur ce téléphone</span>
    <button class="iconbtn" id="openSettings" aria-label="Réglages">
      <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="view" class="view stack"></main>
  <p class="disclaimer" id="disclaimer">Informations générales basées sur les recommandations françaises. Elles ne remplacent jamais l'avis de ta sage-femme, de ton médecin ou de la maternité.</p>
</div>

<nav class="tabs" id="tabs" aria-label="Navigation">
  <div class="in">
    <button data-tab="accueil"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
    <button data-tab="rdv"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>Agenda</button>
    <button data-tab="ia" class="ai" aria-label="Assistant"><span class="aib"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg></span></button>
    <button data-tab="prenoms"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>Prénoms</button>
    <button data-tab="guide"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M9 7h6M9 11h6"/></svg>Guide</button>
  </div>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="sheet" id="sheet" hidden><div class="panel" id="sheetPanel"></div></div>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
